name: AutoDev durable runner

on:
  push:
    branches: [main]
    paths:
      - 'autodev/**'
      - 'organization/**'
      - 'specs/**'
      - 'tests/**'
      - 'development/autodev/M01.json'
      - '.github/workflows/autodev.yml'
  pull_request:
    paths:
      - 'autodev/**'
      - 'organization/**'
      - 'specs/**'
      - 'tests/**'
      - '.github/workflows/autodev.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: autodev-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Full unit, integration, adversarial and HTTP end-to-end verification
        run: python -m unittest discover -s tests -v
      - name: Re-execute labelled M01 simulation
        run: python -m organization.simulation --output .autodev/ci-simulation
      - name: Frozen baseline provenance
        run: python -c "from autodev.runtime import Harness; from pathlib import Path; changed=Harness(Path.cwd()).frozen_changes(); print(changed); assert not changed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: autodev-verification-${{ github.run_id }}
          path: |
            .autodev/ci-simulation
            development/autodev/selftest
          include-hidden-files: true

  resume:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Configure checkpoint identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Resume from repository state
        run: python -m autodev.runtime run
      - name: Record actual cloud worker observation
        run: python -m autodev.cloud_receipt
      - name: Persist state and tags without rewriting history
        if: always()
        run: git push --atomic origin HEAD:main --follow-tags
      - name: Retain recovery evidence even when persistence fails
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: autodev-runtime-${{ github.run_id }}
          path: development/autodev
