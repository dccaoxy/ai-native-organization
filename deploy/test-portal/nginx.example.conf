# Review template only. Replace PILOT_HOST and certificate paths before use.
# Keep this isolated; do not merge it into an existing AEGPC location.
limit_req_zone $binary_remote_addr zone=ai_native_login:10m rate=10r/m;

server {
    listen 443 ssl http2;
    server_name PILOT_HOST;

    ssl_certificate /REPLACE/WITH/FULLCHAIN.pem;
    ssl_certificate_key /REPLACE/WITH/PRIVATEKEY.pem;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /health {
        proxy_pass http://127.0.0.1:18876;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
    }

    location / {
        limit_req zone=ai_native_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:18876;
        proxy_set_header Host $host;
        # Overwrite, rather than append, to prevent a client-supplied chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 80;
    server_name PILOT_HOST;
    return 301 https://$host$request_uri;
}
